apis:
- name: Parallels RAS REST API
  description: >-
    Self-hosted administration REST API for Parallels RAS (Remote Application Server).
    Applications authenticate with administrator credentials to obtain an authToken,
    then manage infrastructure (agents, providers, RD session hosts, VDI), farm and
    site settings, publishing (apps/desktops/folders), policies, and RD sessions.
