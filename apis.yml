aid: parallels
name: Parallels
description: >-
  Parallels is a virtualization and remote-access software company (part of Alludo,
  with the Parallels virtualization division held by KKR) best known for Parallels
  Desktop for Mac, which runs Windows, Linux and other operating systems on Apple
  hardware for over 7 million users. Its enterprise line, Parallels RAS (Remote
  Application Server), delivers virtual apps and desktops (VDI/DaaS) across on-premises
  and hybrid-cloud deployments. For developers and IT admins, Parallels exposes a
  self-hosted Parallels RAS REST API (token-authenticated, port 20443) plus a RAS
  PowerShell administration module and the prlctl/prlsrvctl command-line tools, and
  publishes official Terraform, Packer, Vagrant, and Docker Machine integrations for
  Parallels Desktop from its GitHub organization.
